name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AI_TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Initialize test database
        run: |
          psql "$AI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/000001_init.up.sql
          psql "$AI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed.sql
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build ./...
